<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Ayush Arya — Design, Code, Create</title>
  <desc id="desc">Original dark profile banner with soft green, burgundy, and violet light.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c0d"/>
      <stop offset=".52" stop-color="#111014"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <radialGradient id="green">
      <stop offset="0" stop-color="#233c29" stop-opacity=".66"/>
      <stop offset="1" stop-color="#233c29" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wine">
      <stop offset="0" stop-color="#54222c" stop-opacity=".62"/>
      <stop offset="1" stop-color="#54222c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet">
      <stop offset="0" stop-color="#39284e" stop-opacity=".66"/>
      <stop offset="1" stop-color="#39284e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#779071" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#c1a4bb" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8f77c2" stop-opacity=".08"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="44"/>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="176" cy="298" rx="300" ry="155" fill="url(#green)"/>
    <ellipse cx="570" cy="34" rx="330" ry="180" fill="url(#wine)"/>
    <ellipse cx="1060" cy="260" rx="320" ry="190" fill="url(#violet)"/>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="23" fill="none" stroke="url(#edge)"/>
  <g fill="#eae7e9" opacity=".56">
    <circle cx="113" cy="78" r="1.2"/><circle cx="222" cy="235" r="1"/><circle cx="1008" cy="74" r="1.2"/>
    <circle cx="1096" cy="151" r="1"/><circle cx="936" cy="282" r="1.2"/><circle cx="328" cy="94" r=".8"/>
  </g>
  <text x="600" y="148" text-anchor="middle" fill="#f3f1f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="650" letter-spacing="-2">AYUSH ARYA</text>
  <text x="600" y="193" text-anchor="middle" fill="#aaa4aa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="7">DESIGN  ·  CODE  ·  CREATE</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="1.1" text-anchor="middle">
    <rect x="432" y="225" width="112" height="29" rx="14.5" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="488" y="243.5" fill="#c6c0c6">DISCORD</text>
    <rect x="555" y="225" width="114" height="29" rx="14.5" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="612" y="243.5" fill="#c6c0c6">OPEN SOURCE</text>
    <rect x="680" y="225" width="89" height="29" rx="14.5" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="724.5" y="243.5" fill="#c6c0c6">WEB</text>
  </g>
  <text x="600" y="300" text-anchor="middle" fill="#79747c" font-family="Consolas, monospace" font-size="12" letter-spacing="2">AYUSH7HX  /  INDIA</text>
</svg>
