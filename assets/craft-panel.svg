<svg xmlns="http://www.w3.org/2000/svg" width="400" height="130" viewBox="0 0 400 130" role="img" aria-labelledby="title">
  <title id="title">Good ideas deserve good craft</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151216"/><stop offset="1" stop-color="#20151f"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#783f70" stop-opacity=".46"/><stop offset="1" stop-color="#783f70" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="27"/></filter>
  </defs>
  <rect width="400" height="130" rx="16" fill="url(#bg)"/>
  <ellipse cx="330" cy="90" rx="130" ry="80" fill="url(#glow)" filter="url(#blur)"/>
  <rect x=".6" y=".6" width="398.8" height="128.8" rx="15.4" fill="none" stroke="#e1c4d6" stroke-opacity=".12"/>
  <path d="M348 24l5 11 12 1-9 8 3 12-11-6-10 6 2-12-9-8 12-1z" fill="#dfb1dc" fill-opacity=".78"/>
  <text x="25" y="39" fill="#c498b6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" letter-spacing="3">THE DETAILS</text>
  <text x="25" y="77" fill="#f1ebef" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600">Craft matters.</text>
  <text x="25" y="102" fill="#9d8e98" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Make it useful. Make it feel right.</text>
