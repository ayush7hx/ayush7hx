    <radialGradient id="violet"><stop stop-color="#37274a" stop-opacity=".42"/><stop offset="1" stop-color="#37274a" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
